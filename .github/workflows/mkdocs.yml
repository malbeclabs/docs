# CI: builds the site and fails on any unexpected mkdocs warning. A push to main
# also publishes it to GitHub Pages. Vercel publishing stays removed until
# malbeclabs/infra#3172; restore its job from this file's revision at 7cc3c09.
name: docs
on:
  push:
    branches: [main]
  # The build check for every PR; push builds only main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material mkdocs-static-i18n
      # Build without --strict so the known i18n + navigation.instant warning
      # does not abort. Still fail on any other WARNING (link/config issues).
      # Language alternates are rewritten at runtime (language-selector-label.js).
      - name: Build docs
        run: |
          set -o pipefail
          mkdocs build 2>&1 | tee /tmp/mkdocs-build.log
          # Allow only the known i18n ↔ navigation.instant incompatibility warning
          # (exact message from mkdocs-static-i18n). Any other WARNING fails CI.
          allowed='mkdocs_static_i18n: mkdocs-material language switcher contextual link is not compatible with theme.features = navigation.instant'
          unexpected=$(grep -E '^WARNING' /tmp/mkdocs-build.log | grep -vF "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected mkdocs WARNING(s):"
            echo "$unexpected"
            exit 1
          fi
      # tar --dereference is what keeps the hidden .well-known directory.
      - name: Package site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pages
          tar --dereference -cf /tmp/pages/artifact.tar -C site .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: github-pages
          path: /tmp/pages/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-pages:
    needs: build
    # main only. Keep it ref-based: workflow_dispatch can run from any branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages
