# Publishes the site to GitHub Pages (docs.malbeclabs.com) and Vercel
# (docs.doublezero.xyz). Disabled in the repository's Actions settings, so
# docs publishing is paused until malbeclabs/infra#3172 brings release and
# publish workflows back. CI for the same build is mkdocs.yml.
name: docs deploy
on:
  # All branches, so pushing a branch produces a Vercel preview. Production
  # gates below are keyed on github.ref: every branch push is a push event.
  push:
    branches:
      - '**'
  # Run by hand. Needs write access, so it gets the same deploys as a push.
  workflow_dispatch:

# Least privilege at the top; the pages job re-grants what it needs.
permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material mkdocs-static-i18n
      # Keep this step in sync with mkdocs.yml.
      # Build without --strict so the known i18n + navigation.instant warning
      # does not abort. Still fail on any other WARNING (link/config issues).
      # Language alternates are rewritten at runtime (language-selector-label.js).
      - name: Build docs
        run: |
          set -o pipefail
          mkdocs build 2>&1 | tee /tmp/mkdocs-build.log
          # Allow only the known i18n ↔ navigation.instant incompatibility warning
          # (exact message from mkdocs-static-i18n). Any other WARNING fails CI.
          allowed='mkdocs_static_i18n: mkdocs-material language switcher contextual link is not compatible with theme.features = navigation.instant'
          unexpected=$(grep -E '^WARNING' /tmp/mkdocs-build.log | grep -vF "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected mkdocs WARNING(s):"
            echo "$unexpected"
            exit 1
          fi
      # tar --dereference is what preserves the hidden .well-known directory.
      # Both deploy jobs consume this one artifact, so the two origins cannot drift.
      - name: Package site
        run: |
          mkdir -p /tmp/pages
          tar --dereference -cf /tmp/pages/artifact.tar -C site .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: /tmp/pages/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-pages:
    needs: build
    # main only; the github-pages environment also allows only main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages

  deploy-vercel:
    needs: build
    # Both triggers need write access, so the Vercel token is never exposed
    # to untrusted code. Do not add pull_request or pull_request_target.
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: /tmp/pages
      # The version the last successful production deploy used (2026-10-02).
      - run: npm install --global vercel@62.1.0
      - name: Package for Vercel
        run: scripts/build-vercel-output.sh /tmp/pages/artifact.tar
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (preview)
        if: github.ref != 'refs/heads/main'
        run: |
          set -o pipefail
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/deploy.log | tail -1)
          if [ -z "$url" ]; then
            echo "::error::could not parse a preview URL from the deploy output"
            exit 1
          fi
          # Surface the URL in the run summary; otherwise it is buried in logs.
          {
            echo "### Docs preview"
            echo ""
            echo "$url"
            echo ""
            echo "Requires \`doublezero-foundation\` Vercel team access (SSO-protected)."
          } >> "$GITHUB_STEP_SUMMARY"
