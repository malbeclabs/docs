name: Auto-translate docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**.md'
  # Catches PRs merged before their translation finished; opens a translation PR.
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
  # Manual run from the Actions tab; opens a translation PR against the chosen branch.
  workflow_dispatch:
    inputs:
      files:
        description: 'English sources to translate, comma-separated (empty = every missing or outdated translation)'
        required: false
        default: ''

concurrency:
  # PR runs supersede each other; push and manual runs must never cancel one another,
  # since each only knows about its own changes.
  group: translate-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # PRs: skip the bot's own commits (prevents loops) and fork PRs (no secret access).
    if: >
      github.event_name != 'pull_request' || (
        github.actor != 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install anthropic

      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGUAGES: "zh,ja,ko,pt,es,fr,it"
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FILES_INPUT: ${{ inputs.files }}
        run: |
          case "$EVENT" in
            pull_request)
              python scripts/translate.py --pr-base "$PR_BASE" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "New branch push; nothing to compare against."
                exit 0
              fi
              python scripts/translate.py --since "$PUSH_BEFORE" --skip-translated ;;
            workflow_dispatch)
              if [ -n "$FILES_INPUT" ]; then
                IFS=',' read -ra FILES <<< "$FILES_INPUT"
                python scripts/translate.py --files "${FILES[@]}"
              else
                python scripts/translate.py --stale
              fi ;;
          esac

      - name: Commit translations to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "chore: auto-translate docs"
          git push origin HEAD:${{ github.head_ref }}

      - name: Open translation PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.ref_name }}
          BRANCH: chore/auto-translate-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          FILES=$(git diff --cached --name-only | sed 's/^/- `/; s/$/`/')
          git checkout -b "$BRANCH"
          git commit -m "chore: auto-translate docs"
          git push origin "$BRANCH"
          gh pr create --base "$TARGET" --head "$BRANCH" \
            --title "chore: auto-translate docs" \
            --body "Automated translations from the \`${{ github.event_name }}\` run on \`$TARGET\` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          $FILES"
