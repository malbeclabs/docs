site_name: DoubleZero
site_url: https://docs.doublezero.xyz/
site_description: >-
  Documentation for connecting to and operating on the Malbec Labs / DoubleZero
  network — validator and tenant setup, multicast, rewards, geolocation, and
  contributor operations.
theme:
  name: material
  custom_dir: overrides
  logo: logo.svg
  favicon: favicon.ico
  palette:
    # Dark is the default (first entry). Toggle appears in the header.
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  # Self-hosted Reckless + Suisse Intl (DoubleZero brand kit) via extra.css
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.tracking
    # Instant nav: language switcher uses JS path rewriting (see
    # language-selector-label.js). i18n still warns about Material's built-in
    # contextual alternates; CI allows that one known warning.
    - navigation.instant
    - navigation.instant.progress
plugins:
  - search
  # NOTE: llms.txt / llms-full.txt are generated by hooks/emit_markdown.py.
  # The mkdocs-llmstxt plugin does not support mkdocs-static-i18n (it cannot
  # resolve localized page URIs), so we build them ourselves from the default
  # (English) locale.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
        - locale: ja
          name: 日本語
          build: true
        - locale: ko
          name: 한국어
          build: true
        - locale: pt
          name: Português
          build: true
        - locale: es
          name: Español
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: it
          name: Italiano
          build: true
nav:
  - Welcome: index.md
  - Quick Connect: quick-connect.md
  - Users:
    - Setup: setup.md
    - Tenants:
      - Overview: tenant.md
      - Solana:
        - Validator Mainnet-Beta Connection: DZ Mainnet-beta Connection.md
        - Validator Testnet Connection: DZ Testnet Connection.md
        - Permissioned Connection: Permissioned Connection.md
        - Validator Multicast Connection: Validator Multicast Connection.md
        - Validator Rewards: Validator Rewards.md
        - Other Multicast Connection: Other Multicast Connection.md
        - Edge Subscriber Connection: Edge Subscriber Connection.md
        - Troubleshooting: troubleshooting.md
      - Shelby:
        - Shelby Connection: Shelby Permissioned Connection.md
      - New Tenant: New Tenant.md
    - Geolocation: geolocation.md
  - Contributors:
    - Overview: contribute-overview.md
    - Requirements & Architecture: contribute.md
    - Device Provisioning: contribute-provisioning.md
    - Operations: contribute-operations.md
    - OPS Management: contribute-ops-management.md
    - Geolocation: contribute-geolocation.md
    - Decommissioning: contribute-decommission.md
  - Architecture: architecture.md
  - Glossary: glossary.md
  - Support: support.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - toc:
      title: On this page
extra_css:
  - stylesheets/extra.css
  - stylesheets/wizard.css
extra_javascript:
  - javascripts/cloudsmith-versions.js
  - javascripts/connection-wizard.js
  - javascripts/page-toolbar.js
  - javascripts/nav-accordion.js
  - javascripts/toc-page-top.js
  - javascripts/header-controls-order.js
  - javascripts/theme-mode-switch.js
  - javascripts/language-selector-label.js
  - javascripts/search-language-filter.js
  - javascripts/mathjax.js
  - path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
hooks:
  - hooks/emit_markdown.py
  - hooks/emit_well_known.py
