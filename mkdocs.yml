site_name: DoubleZero
site_url: https://docs.doublezero.xyz/
site_description: >-
  Documentation for connecting to and operating on the Malbec Labs / DoubleZero
  network — validator and tenant setup, multicast, rewards, geolocation, and
  contributor operations.
# Machine-oriented runbooks stay in git for MCP / GitHub raw, but are not built
# into the public docs site.
exclude_docs: |
  runbooks.md
  runbooks.*.md
  solana-ibrl-runbook.md
  solana-ibrl-runbook.*.md
  solana-shreds-runbook.md
  solana-shreds-runbook.*.md
  solana-shreds-publisher-runbook.md
  solana-shreds-publisher-runbook.*.md
  kalshi-runbook.md
  kalshi-runbook.*.md
  phoenix-runbook.md
  phoenix-runbook.*.md
  hyperliquid-edge-runbook.md
  hyperliquid-edge-runbook.*.md
validation:
  anchors: warn
theme:
  name: material
  custom_dir: overrides
  logo: logo.svg
  favicon: favicon.ico
  palette:
    # Dark is the default (first entry). Toggle appears in the header.
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  # Self-hosted Reckless + Suisse Intl (DoubleZero brand kit) via extra.css
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.tracking
    # Instant nav: language switcher uses JS path rewriting (see
    # language-selector-label.js). i18n still warns about Material's built-in
    # contextual alternates; CI allows that one known warning.
    - navigation.instant
    - navigation.instant.progress
plugins:
  - search
  # NOTE: llms.txt / llms-full.txt are generated by hooks/emit_markdown.py.
  # The mkdocs-llmstxt plugin does not support mkdocs-static-i18n (it cannot
  # resolve localized page URIs), so we build them ourselves from the default
  # (English) locale.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
        - locale: ja
          name: 日本語
          build: true
        - locale: ko
          name: 한국어
          build: true
        - locale: pt
          name: Português
          build: true
        - locale: es
          name: Español
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: it
          name: Italiano
          build: true
nav:
  - Welcome: index.md
  - Setup: setup.md
  - Solana:
    - IBRL:
      - Connect validator: solana/ibrl/publish.md
      - Permissioned / RPC: solana/ibrl/subscribe.md
    - Edge:
      - Publish shreds: solana/edge/publish.md
      - Subscribe to shreds: solana/edge/subscribe.md
      - Subscribe to shreds (CLI legacy): solana/edge/subscribe-cli.md
      - Validator Rewards: solana/edge/rewards.md
  - Hyperliquid:
    - hyperliquid/index.md
    - Subscribe to Hyperliquid (Edge): hyperliquid/edge.md
    - Peering Access: hyperliquid/peering.md
  - Binance: binance.md
  - Kalshi: kalshi.md
  - Phoenix: phoenix.md
  - Shelby: shelby.md
  - Contributors:
    - Overview: contributors/index.md
    - Requirements & Architecture: contributors/requirements.md
    - Device Provisioning: contributors/provisioning.md
    - Operations: contributors/operations.md
    - OPS Management: contributors/ops-management.md
    - Geolocation: contributors/geolocation.md
    - Decommissioning: contributors/decommissioning.md
  - Reference:
    - Architecture: reference/architecture.md
    - Other multicast: reference/other-multicast.md
    - Geolocation: reference/geolocation.md
    - Glossary: reference/glossary.md
  - Support:
    - support/index.md
    - Troubleshooting: support/troubleshooting.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - toc:
      title: On this page
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/cloudsmith-versions.js
  - javascripts/page-toolbar.js
  - javascripts/nav-accordion.js
  - javascripts/toc-page-top.js
  - javascripts/header-controls-order.js
  - javascripts/theme-mode-switch.js
  - javascripts/language-selector-label.js
  - javascripts/search-language-filter.js
  - javascripts/mathjax.js
  - path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
hooks:
  - hooks/exclude_runbooks.py
  - hooks/emit_markdown.py
  - hooks/emit_well_known.py
  - hooks/redirects.py
